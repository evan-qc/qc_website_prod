title: Quantify
description: "Quantify is the fractional data and systems department for the counties, authorities, agencies, and employers of New York's North Country. Dashboards, custom apps, automation, and financial modeling. Based in Lowville, NY."
baseurl: ""   # served at the root of the custom domain (quantify.fyi)

# ---------------------------------------------------------------------------
# Contact and org details.
#
# These are the single source of truth. Every page pulls from here, so a change
# in this block updates the whole site. Do not hardcode any of them in a page.
# ---------------------------------------------------------------------------
email: "hello@quantify-consulting.com"
careers_email: "careers@quantify-consulting.com"
address_street: "5423 Shady Ave"
address_locality: "Lowville"
address_region: "NY"
address_postal: "13367"
linkedin_url: "https://www.linkedin.com/company/quantify-consulting-llc"

# Deliberately no phone number. Email and the Airtable form are the two
# contact channels; see get-started.html.

# ---------------------------------------------------------------------------
# Consulting-firm delivery capacity.
#
# This is the line that makes /for-consulting-firms convert, and it is stale
# the moment it is wrong. Update `availability_hours` monthly and set
# `availability_updated` to the month it reflects. Leave availability_hours
# empty ("") to hide the availability callout entirely rather than show a
# number nobody has checked.
# ---------------------------------------------------------------------------
availability_hours: ""            # e.g. "30 hours/week"
availability_updated: ""          # e.g. "September 2026"

# Collections
collections:
  case_studies:
    output: true
    permalink: /case-studies/:name/

# Default layouts per content type
defaults:
  - scope:
      path: ""
      type: case_studies
    values:
      layout: case-study
      # `rank` controls order on the Our Work grid, lowest first.
      # Ranks are spaced by 10 (10, 20, 30 ...) so a new study can be
      # slotted mid-lineup with an in-between value (e.g. 25) without
      # renumbering the others. Unranked studies fall back to 9999 (last).
      rank: 9999
      capabilities: []  # keeps capability filtering safe when none are tagged
