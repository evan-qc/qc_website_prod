# Client pins on the compact Northern New York map in the homepage hero
# (_includes/nny-map.html).
#
# x/y are SVG user units in the statewide viewBox recorded in
# _data/map_meta.yml, which also carries a lookup table of projected town
# coordinates. The hero map is a crop of that same coordinate system, so the
# numbers need no conversion. To add a pin:
# copy the x/y for the town from that table, nudge by a few units if it would
# collide with an existing pin, and add a row here. No script needed unless the
# town is missing from the table.
#
# Fields:
#   label    org name shown on hover and to screen readers (required)
#   town     shown under the label on hover (required)
#   url      case study to link to. Omit for an unlinked pin.
#   status   omit for a normal pin, or "in-progress" for the hollow pin
#            used for engagements that are live but not yet publishable.
#
# Deliberately not pinned, and why:
#   - The two Anonymous County studies. Pinning them would identify the client.
#   - Commercial Food Sanitation. Global operation, no Northern New York
#     location to pin honestly.

# Four clients share Lowville. Lewis County Government sits on the town
# itself; the others are fanned out around it just far enough (about 16 user
# units) that the pins do not overlap at hero size. Positions in that cluster
# are schematic, not street addresses.
- label: "Lewis County Government"
  town: "Lowville"
  x: 509.9
  y: 211.3
  url: "/case-studies/lewis-county-financial-transparency/"

- label: "Development Authority of the North Country"
  town: "Watertown"
  x: 461.9
  y: 182.1
  url: "/case-studies/north-country-landfill-financial-model/"

- label: "Christian Community Center"
  town: "Turin"
  x: 519.0
  y: 235.7
  url: "/case-studies/christian-community-center-rental-automation/"

# Engagement in flight. Unlinked until it wraps and we have sign-off.
# Nudged south-west of the Lewis County pin so the two Lowville pins do not
# sit on top of each other at hero size.
- label: "Naturally Lewis"
  town: "Lowville"
  x: 496.0
  y: 224.0
  status: "in-progress"

- label: "Double Play Community Center"
  town: "Lowville"
  x: 523.0
  y: 202.0
  url: "/case-studies/double-play-grant-reporting/"

- label: "North Country Handymen"
  town: "Lowville"
  x: 500.0
  y: 198.0
  url: "/case-studies/nch-case-study/"
