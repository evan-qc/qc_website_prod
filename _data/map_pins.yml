# The shared statewide map (_includes/nys-map.html): the Lowville office star,
# and the client pins shown on the large "Why we're here" map on the homepage.
# The small hero map uses the same file for the star only; it never shows pins.
#
# x/y are SVG user units in the statewide viewBox recorded in
# _data/map_meta.yml, which also carries a lookup table of projected town
# coordinates. Copy the x/y for the town from that table. A town that is not
# listed needs a row in TOWNS in tools/build_map.py and a re-run.

# ---------------------------------------------------------------------------
# Office star. 5423 Shady Ave sits inside the Village of Lowville, so the
# village centre (43.787, -75.492) is used: at statewide scale the two points
# are the same pixel. Only the hero map shows it.
# ---------------------------------------------------------------------------
office:
  label: "Lowville"
  x: 509.9
  y: 211.3

# ---------------------------------------------------------------------------
# Client pins, on the large "Why we're here" map. The rule: a pin means a
# published case study. Every pin needs a `url`, and a client without a
# public case study gets no pin, whatever permission we have for its logo.
#
# Fields:
#   label    org name, shown on hover, tap and focus (required)
#   town     shown after the name (required)
#   url      the published case study the pin links to (required)
#   x, y     the client's real location, from the towns table in
#            _data/map_meta.yml
#   dx, dy   optional nudge in CSS pixels, applied after x/y.
#
# Pins sit where the clients are. At statewide scale a mile is about one
# pixel on a phone, so Turin lands 9px from Lowville and Watertown 19px. The
# nudges below are the smallest that keep every dot separate and tappable at
# 390px wide, and each one points the true direction from Lowville:
#   Lewis County Government   Lowville, no nudge (the anchor)
#   Double Play               slightly north-west of Lowville
#   North Country Handymen    slightly east of Lowville
#   Christian Community Ctr   Turin, south-south-east, pushed a little
#                             further out along that line
#   DANC                      Watertown, 6px west so Double Play fits
#                             between it and Lowville
# Check a new pin at 390px and 1366px wide before shipping it.
#
# Deliberately not pinned, and why:
#   - Jefferson County. Logo permission only, no public case study.
#   - Naturally Lewis. Engagement still in progress; pin it when the case
#     study is published.
#   - The two Anonymous County studies. Pinning them would identify the client.
#   - Commercial Food Sanitation. Global operation, no North Country location
#     to pin honestly.
#   - Lewis County Building Codes, Solid Waste, and Planning. All Lewis County
#     Government, which already has a pin.
# ---------------------------------------------------------------------------
pins:
  - label: "Lewis County Government"
    town: "Lowville"
    x: 509.9
    y: 211.3
    url: "/case-studies/lewis-county-financial-transparency/"

  - label: "Development Authority of the North Country"
    town: "Watertown"
    x: 461.9
    y: 182.1
    dx: -6
    url: "/case-studies/north-country-landfill-financial-model/"

  - label: "Christian Community Center"
    town: "Turin"
    x: 519.0
    y: 235.7
    dx: 2
    dy: 10
    url: "/case-studies/christian-community-center-rental-automation/"

  - label: "Double Play Community Center"
    town: "Lowville"
    x: 509.9
    y: 211.3
    dx: -6
    dy: -16
    url: "/case-studies/double-play-grant-reporting/"

  - label: "North Country Handymen"
    town: "Lowville"
    x: 509.9
    y: 211.3
    dx: 18
    url: "/case-studies/nch-case-study/"
