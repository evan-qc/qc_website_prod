# Recent work. Three case studies, in display order (the Development
# Authority landfill model leads), with plain-language headlines and summaries
# that override the study's own on the homepage card only. The case study
# pages keep their detailed titles and technical language.
# ---------------------------------------------------------------------------
featured_work:
  - slug: north-country-landfill-financial-model
    headline: "A 50-year plan for the landfill that serves the North Country"
    summary: "We turned a fragile Excel workbook into a planning model the Authority's leadership runs together, in the room."
  - slug: lewis-county-financial-transparency
    headline: "Lewis County's budget reports went from five days to real time"
    summary: "Staff and the public can now see the county's financial picture the moment it changes, built on top of the ERP the county already had."
  - slug: commercial-food-sanitation-core-business-platform
    headline: "Six spreadsheets became one system, run from the plant floor"
    summary: "A global food safety team now schedules and reports out of one connected platform instead of a stack of fragile files."

