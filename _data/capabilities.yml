# The capability menu. One source of truth for every rendering:
#   - the six-tile grid on the homepage (short + tile_line)
#   - the full sections on what-we-do.html (tagline, body, tools, proofs)
#   - the "What we did" filter chips on case-studies.html (slug + short)
#
# The rule for this page is that every claim points at evidence. `proofs`
# should stay populated. If a capability has no case study behind it, set
# `proof_note` instead so the gap is visible rather than papered over.
#
# `short` is the canonical label. It must read identically on the homepage,
# on what-we-do.html, and on the case-study filter chips. Do not paraphrase.
#
# `slug` is the anchor on what-we-do.html and the tag used in case-study
# front matter. `aliases` carries anchors retired in the eight-to-six
# consolidation so old deep links keep resolving.
#
# Homepage tile fields. Each tile leads with the buyer's problem, then what
# we do, then a proof link:
#   `tile_problem`     the problem, in the buyer's own voice (rendered italic)
#   `tile_line`        what we do, one line. Omit it and the tagline is used.
#   `tile_proof_name`  client named in "See it in action: [Client]"
#   `tile_proof_url`   that client's case study. Omit both for no proof link.
# TODO(Evan): confirm each tile_proof pairing matches what the project was.
# They were matched from case study titles.

- slug: dashboards
  short: "Dashboards &amp; Reporting"
  title: "Dashboards &amp; Reporting"
  aliases: [data-cleanup]
  tagline: "Numbers your board and your staff can see today, not at month end."
  tile_problem: "The board asks a question and the answer takes a week."
  tile_line: "Numbers your board and staff can see today, not at month end."
  tile_proof_name: "Lewis County"
  tile_proof_url: "/case-studies/lewis-county-financial-transparency/"
  body: >-
    Most organizations already collect what they need. The problem is that getting it
    into a usable form takes someone three days and a stack of exports, so it happens
    monthly at best and nobody fully trusts the result. We build the pipeline and the
    reporting layer underneath, so the number is current, the number is right, and
    there is exactly one of it.
  body_2: >-
    Often the real work happens before any dashboard exists. Plenty of organizations
    are sitting on years of records in a system that technically holds everything and
    practically answers nothing. Modeling that data properly is sometimes the entire
    project, and it is sometimes the most valuable thing we do.
  tools: "Power BI, Tableau, Looker Studio, or whatever you already own."
  proofs:
    - text: "Lewis County went from three to five day budget reporting to live dashboards for staff and the public."
      url: "/case-studies/lewis-county-financial-transparency/"
    - text: "We remodeled a county's existing but unusable HMIS data into an analytics platform that surfaces individual client journeys and program-level insight on homelessness."
      url: "/case-studies/anonymous-county-homelessness-analytics-from-existing-hmis-data/"

- slug: custom-apps
  short: "Custom Applications"
  title: "Custom Applications"
  tagline: "Replace the pile of spreadsheets with one system your team runs the work in."
  tile_problem: "Nine spreadsheets and a group text are running the operation."
  tile_line: "One system your team actually runs the work in."
  tile_proof_name: "Commercial Food Sanitation"
  tile_proof_url: "/case-studies/commercial-food-sanitation-core-business-platform/"
  body: >-
    There is a gap between a spreadsheet that has stopped coping and enterprise
    software that costs six figures and eighteen months. Almost every organization we
    meet is stuck in it. We build in that gap: a real relational system, with the
    fields your work actually has, the automations your process actually needs, and a
    screen your team can use on a phone in a truck.
  tools: "Usually Airtable. Live in weeks."
  proofs:
    - text: "Lewis County Building Codes replaced 24 disconnected spreadsheets with one inspection application. A five-person team now runs fire safety inspections county-wide from one place."
      url: "/case-studies/lewis-county-building-codes-inspection-app/"

- slug: modeling
  short: "Financial Modeling &amp; Forecasting"
  title: "Financial Modeling &amp; Forecasting"
  tagline: "Scenario planning your leadership team can run themselves."
  tile_problem: "Your long-range plan lives in one workbook that one person understands."
  tile_line: "Models your leadership can run together, in the meeting."
  tile_proof_name: "Development Authority of the North Country"
  tile_proof_url: "/case-studies/north-country-landfill-financial-model/"
  body: >-
    The financial model that matters most is usually the one nobody will touch: a
    workbook one person built, that breaks if you change a cell, that cannot answer
    the question the board just asked. We rebuild those as tools. You change an
    assumption, you see the consequence, in the meeting.
  tools: >-
    Capital planning, rate and fee analysis, long-range forecasting, cost-benefit
    analysis, and the multi-decade models that authorities and utilities are required
    to defend.
  proofs:
    - text: "We turned the Development Authority of the North Country's brittle landfill workbook into a 50-year scenario-planning engine its leadership uses together."
      url: "/case-studies/north-country-landfill-financial-model/"

- slug: grants
  short: "Grant &amp; Compliance Reporting"
  title: "Grant &amp; Compliance Reporting"
  tagline: "Prove what you brought in and what it did, on the state's schedule."
  tile_problem: "Grant reporting eats a week every quarter."
  tile_line: "Prove what you brought in and what it did, on the state's schedule."
  tile_proof_name: "Double Play Community Center"
  tile_proof_url: "/case-studies/double-play-grant-reporting/"
  body: >-
    Grant and compliance reporting is annual, mandatory, and almost always assembled
    by hand under deadline by someone who has a different day job. We build the system
    that tracks the commitments, the dollars, and the outcomes year-round, so the
    report is a query instead of a fire drill. It also makes the case: most
    organizations are worse at proving their own value than they are at creating it.
  proofs:
    - text: "We consolidated 30-plus grant-tracking tables into one relational system and built a public dashboard showing that Lewis County's grant office brings home more than $5M a year."
      url: "/case-studies/lewis-county-grant-funding-transparency/"

- slug: automation
  short: "Automation &amp; Integration"
  title: "Automation &amp; Integration"
  aliases: [integration]
  tagline: "Stop entering the same information three times."
  tile_problem: "You type the same information into three different places."
  tile_line: "Enter it once, and stop chasing approvals by email."
  tile_proof_name: "Christian Community Center"
  tile_proof_url: "/case-studies/christian-community-center-rental-automation/"
  body: >-
    Double entry is not a discipline problem, it is a plumbing problem. When your ERP,
    your scale system, and somebody's Excel file have no way to talk, a person becomes
    the integration. Same with the work itself: forms that get re-keyed, approvals
    that live in an email chain, a request that has to be chased through four people
    before anyone knows where it stands.
  body_2: >-
    We map how the work really happens, remove the person from the middle, and
    automate the steps that never needed a human. The data moves on its own, and it
    matches on both ends.
  proofs:
    - text: "We unified the Lewis County Solid Waste Department's scale system, ERP and Excel records into one Azure data warehouse feeding live internal and public dashboards."
      url: "/case-studies/lewis-county-solid-waste-operations-intelligence/"
    - text: "We replaced a county's manual, Adobe-form resolution process with an automated workflow that drafts, files and tracks every submission, giving 30 departments real-time visibility into where their requests stand."
      url: "/case-studies/workflow-automation-for-resolution-drafting-in-county-government/"

- slug: assessments
  short: "Technology &amp; Security Assessments"
  title: "Technology &amp; Security Assessments"
  tagline: "An honest read on where you stand and what to fix first."
  tile_problem: "You're not sure your IT would hold up on a bad day."
  tile_line: "An honest read on where you stand and what to fix first, from someone who's run IT for a county."
  body: >-
    If you have an IT vendor but no IT director, nobody is sitting on your side of the
    table. That is the gap this fills.
  body_2: >-
    We assess what you are running, where the real risk sits, what your insurer or
    your auditor is going to ask about, and what to do in what order. Then we tell you
    plainly, including the parts you will not enjoy hearing.
  # This capability's evidence is the practitioner rather than a published case
  # study, so it renders as a "Who does this work" block instead of a proof line.
  practitioner_label: "Who does this work"
  practitioner: >-
    Conner Biolsi spent nearly six years as IT Director for Lewis County government,
    where he rebuilt the county's entire infrastructure stack, stood up secure remote
    work across departments, and strengthened its cybersecurity posture on a
    public-sector budget with public-sector accountability. He was elected to the
    board of the New York State Local Government IT Directors Association,
    coordinating technology across the state's municipalities, school districts,
    BOCES, community colleges and authorities. He is Certified in Cybersecurity and
    came out of J.P. Morgan Chase technology before that.
  practitioner_kicker: "He has read the assessment from your side of the desk. Now he writes them."
