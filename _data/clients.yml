# Homepage "Trusted by" marquee (_includes/client-logos.html).
#
# Drop a logo in as permission lands: put the file under assets/ and set
# `logo`, `logo_width` and `logo_height` (the file's pixel size, so the tile
# reserves space and the page does not shift). Until then the tile renders the
# client's name as clean text. Never recreate or approximate a client's logo.
#
# Fields:
#   name     client name. Used as the text fallback and as the image alt text.
#   logo     path under /assets/. Omit for a text tile.
#   url      case study to link to (required: logos imply finished work).
#
# Only completed engagements belong here. Naturally Lewis stays off until that
# engagement wraps; it lives in _data/work_in_progress.yml meanwhile.
#
# TODO(Evan): logo files still missing for Lewis County, Development Authority
# of the North Country, Commercial Food Sanitation, Double Play Community
# Center, and Christian Community Center (see note below).

- name: "Lewis County"
  url: "/case-studies/lewis-county-financial-transparency/"

- name: "Development Authority of the North Country"
  url: "/case-studies/north-country-landfill-financial-model/"

- name: "Commercial Food Sanitation"
  url: "/case-studies/commercial-food-sanitation-core-business-platform/"

- name: "Double Play Community Center"
  url: "/case-studies/double-play-grant-reporting/"

- name: "North Country Handymen"
  url: "/case-studies/nch-case-study/"
  logo: "/assets/case-studies/nch_logo.webp"
  logo_width: 2000
  logo_height: 1250

# The logo we have for CCC is a JPG with a baked-in dark background, which
# renders as a black box beside the light tiles. Left as text until we get a
# transparent PNG or SVG.
- name: "Christian Community Center"
  url: "/case-studies/christian-community-center-rental-automation/"
