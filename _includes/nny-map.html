<!-- =========================================================
     Compact Northern New York map (homepage hero).

     Geometry is a crop of the statewide county map, generated by
     tools/build_nny_map.py. Pins come from _data/map_pins.yml and
     share the statewide coordinate system, so adding a client is
     still a data edit, not an SVG edit.

     Only the eight Northern New York counties render. A corner
     inset shows where they sit in the state. County and pin names
     appear on hover (desktop) and tap (touch) through the small
     script at the bottom; the <desc> carries all of it for screen
     readers, since a hover label is invisible to them.

     The SVG is role="img", which makes its children presentational,
     so pins are pointer and touch shortcuts only (tabindex="-1").
     Every pinned case study is also a real, focusable link in the
     logo marquee and Recent work directly below.
     ========================================================= -->
{% assign nny = site.data.nny_map_meta %}
<figure class="nny-map" data-nny-map>
    <div class="nny-map-box">
        <svg class="nny-map-svg" viewBox="{{ nny.viewbox }}"
             preserveAspectRatio="xMidYMid meet"
             role="img" aria-labelledby="nny-map-title nny-map-desc">
            <title id="nny-map-title">Map of Northern New York</title>
            <desc id="nny-map-desc">The eight counties of Northern New York: Oneida, Oswego, Herkimer, Lewis, Jefferson, St. Lawrence, Hamilton, and Franklin. Quantify is based in Lowville, in Lewis County. Pins mark client locations: {% for pin in site.data.map_pins %}{{ pin.label }} in {{ pin.town }}{% if pin.status == 'in-progress' %} (engagement in progress){% endif %}{% unless forloop.last %}, {% endunless %}{% endfor %}.</desc>

            <g class="nny-counties">{% include nny-counties.svg.html %}</g>

            <g class="nny-pins">
                {%- for pin in site.data.map_pins %}
                {%- capture pin_label %}{{ pin.label }} · {{ pin.town }}{% if pin.status == 'in-progress' %} · in progress{% endif %}{% endcapture %}
                {%- if pin.url %}
                <a class="nny-pin" href="{{ pin.url | relative_url }}" data-label="{{ pin_label | strip }}" tabindex="-1" aria-hidden="true">
                    <circle class="nny-pin-hit" cx="{{ pin.x }}" cy="{{ pin.y }}" r="13"></circle>
                    <circle class="nny-pin-halo" cx="{{ pin.x }}" cy="{{ pin.y }}" r="8"></circle>
                    <circle class="nny-pin-dot" cx="{{ pin.x }}" cy="{{ pin.y }}" r="5"></circle>
                </a>
                {%- else %}
                <g class="nny-pin nny-pin--progress" data-label="{{ pin_label | strip }}" aria-hidden="true">
                    <circle class="nny-pin-hit" cx="{{ pin.x }}" cy="{{ pin.y }}" r="13"></circle>
                    <circle class="nny-pin-dot" cx="{{ pin.x }}" cy="{{ pin.y }}" r="5"></circle>
                </g>
                {%- endif %}
                {%- endfor %}
            </g>
        </svg>

        <svg class="nny-inset" viewBox="{{ nny.inset_viewbox }}" aria-hidden="true" focusable="false">
            {% include nny-inset.svg.html %}
        </svg>

        <div class="nny-tip" aria-hidden="true" hidden></div>
    </div>
    <figcaption class="nny-map-caption">Eight counties. One team, based in Lowville.</figcaption>
</figure>

<script>
  // Hover (mouse) and tap (touch) show the same label.
  // On touch, the first tap on a pin shows its name and the second follows the
  // link, so a tap never navigates away before the label has been seen.
  (function () {
    var map = document.querySelector('[data-nny-map]');
    if (!map) return;
    var box = map.querySelector('.nny-map-box');
    var tip = map.querySelector('.nny-tip');
    var armed = null;

    function show(el) {
      var label = el.getAttribute('data-label');
      if (!label) return;
      tip.textContent = label;
      tip.hidden = false;
      var b = box.getBoundingClientRect();
      var r = el.getBoundingClientRect();
      var x = r.left + r.width / 2 - b.left;
      var y = r.top - b.top;
      tip.style.left = Math.max(8, Math.min(b.width - 8, x)) + 'px';
      tip.style.top = Math.max(0, y) + 'px';
    }

    function hide() { tip.hidden = true; armed = null; }

    function target(e) { return e.target.closest && e.target.closest('[data-label]'); }

    map.addEventListener('pointerover', function (e) {
      if (e.pointerType === 'touch') return;
      var el = target(e);
      if (el) show(el);
    });
    map.addEventListener('pointerleave', function (e) {
      if (e.pointerType !== 'touch') hide();
    });

    map.addEventListener('click', function (e) {
      var el = target(e);
      if (!el) { hide(); return; }
      // Only intercept genuine taps; mouse clicks follow links straight away.
      if (map.getAttribute('data-last-pointer') !== 'touch') return;
      if (el.tagName.toLowerCase() === 'a' && armed === el) return;
      e.preventDefault();
      show(el);
      armed = el;
    });
    map.addEventListener('pointerdown', function (e) {
      map.setAttribute('data-last-pointer', e.pointerType);
    });
    document.addEventListener('pointerdown', function (e) {
      if (!map.contains(e.target)) hide();
    });
  })();
</script>
