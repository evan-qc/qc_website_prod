<!-- Email, from _config.yml. Used by the homepage closing CTA and
     get-started.html. We publish no phone number, so email is the one
     direct line. Pass class="..." to add a modifier (e.g. direct-contact--on-dark). -->
<ul class="direct-contact{% if include.class %} {{ include.class }}{% endif %}">
    <li>
        <span class="direct-contact-label">Email</span>
        <a href="mailto:{{ site.email }}">{{ site.email }}</a>
    </li>
</ul>
