<!-- Abbreviated capability menu for the homepage. Six tiles, headline plus one
     line, from _data/capabilities.yml. Tiles prefer `tile_line` over `tagline`
     because the homepage tile is the only copy a skimmer reads. The full
     sections, with proof, live on what-we-do.html. -->
<ul class="capability-tiles">
    {%- for cap in site.data.capabilities %}
    <li class="capability-tile">
        <a href="{{ '/what-we-do.html' | relative_url }}#{{ cap.slug }}">
            <h3>{{ cap.short }}</h3>
            <p>{{ cap.tile_line | default: cap.tagline }}</p>
        </a>
    </li>
    {%- endfor %}
</ul>
